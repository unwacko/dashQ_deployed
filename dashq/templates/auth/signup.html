{% extends "auth/layout.html" %}
{% block title %}Sign up · dashQ{% endblock %}
{% block box %}
<div><h2>Sign up</h2><p class="muted" style="margin-top:4px">Free while in beta. You get a QR code after signing up.</p></div>
<form method="post" class="stack" style="gap:14px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">Business name
    <input class="input big" name="name" value="{{ form.get('name', '') }}" placeholder="e.g. Encave Cafe" maxlength="80" required>
  </label>
  <label class="field">Type of business
    <select class="input big" name="category">
      {% for category in categories %}<option {% if form.get('category') == category %}selected{% endif %}>{{ category }}</option>{% endfor %}
    </select>
  </label>
  <label class="field">Email
    <input class="input big" type="email" name="email" value="{{ form.get('email', '') }}" placeholder="you@business.com" autocomplete="email" required>
  </label>
  <label class="field">Password <span class="hint">at least 8 characters</span>
    <input class="input big" type="password" name="password" minlength="8" autocomplete="new-password" required>
  </label>
  <button class="btn big block" type="submit">Create account {{ ui.icon("arrow-right") }}</button>
</form>
<p class="small muted" style="text-align:center">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
